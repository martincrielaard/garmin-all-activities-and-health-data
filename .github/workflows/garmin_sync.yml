name: Garmin Connect Daily Sync

on:
  schedule:
    # Cover both CET and CEST: 08:00 and 20:00 Amsterdam time
    - cron: "0 6 * * *"   # 08:00 CEST (UTC+2) -> 06:00 UTC
    - cron: "0 7 * * *"   # 08:00 CET  (UTC+1) -> 07:00 UTC
    - cron: "0 18 * * *"  # 20:00 CEST (UTC+2) -> 18:00 UTC
    - cron: "0 19 * * *"  # 20:00 CET  (UTC+1) -> 19:00 UTC
  workflow_dispatch:

concurrency:
  group: garmin-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install garminconnect gspread google-auth pandas
          fi

      - name: Run sync (daily_sync.py or fallback to activities+health) with logging
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          # --- Ensure we only run at 08:00 or 20:00 Europe/Amsterdam local time ---
          local_hour=$(TZ='Europe/Amsterdam' date +%H)
          echo "Local hour in Europe/Amsterdam: $local_hour"
          if [ "$local_hour" != "08" ] && [ "$local_hour" != "20" ]; then
            echo "Not scheduled Amsterdam hour (08 or 20). Skipping run."
            exit 0
          fi

          # Try daily_sync.py if present, otherwise run the two separate scripts.
          if [ -f daily_sync.py ]; then
            python daily_sync.py 2>&1 | tee sync.log
            exit_code=${PIPESTATUS[0]}
          else
            python sync_activities.py 2>&1 | tee sync_activities.log
            act_code=${PIPESTATUS[0]}
            python sync_health.py 2>&1 | tee sync_health.log
            hlth_code=${PIPESTATUS[0]}
            # combine logs for convenience
            cat sync_activities.log sync_health.log > sync.log || true
            # prefer nonzero exit if any failed
            if [ "${act_code}" != "0" ] || [ "${hlth_code}" != "0" ]; then
              exit_code=1
            else
              exit_code=0
            fi
          fi
          exit ${exit_code}

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log
          path: sync.log
