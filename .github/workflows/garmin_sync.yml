name: Garmin Connect Daily Sync

on:
  schedule:
    - cron: "0 6 * * *"   # ~08:00 Amsterdam (CEST)
    - cron: "0 18 * * *"  # ~20:00 Amsterdam (CEST)
  workflow_dispatch:

concurrency:
  group: garmin-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install garminconnect gspread google-auth pandas
          fi

      - name: Run sync (daily_sync.py or fallback to activities+health) with logging
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ -f daily_sync.py ]; then
            python daily_sync.py 2>&1 | tee sync.log
            exit_code=${PIPESTATUS[0]}
          else
            python sync_activities.py 2>&1 | tee sync_activities.log
            act_code=${PIPESTATUS[0]}
            python sync_health.py 2>&1 | tee sync_health.log
            hlth_code=${PIPESTATUS[0]}
            cat sync_activities.log sync_health.log > sync.log || true
            if [ "${act_code}" != "0" ] || [ "${hlth_code}" != "0" ]; then
              exit_code=1
            else
              exit_code=0
            fi
          fi
          exit ${exit_code}

      - name: Run goals check and produce email body
        if: always()
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # configureerbare doelen (optioneel, default in script ook aanwezig)
          GOAL_DISTANCE_KM: ${{ secrets.GOAL_DISTANCE_KM }}   # bv "10" (km)
          GOAL_STEPS: ${{ secrets.GOAL_STEPS }}               # bv "10000"
          EMAIL_TO: ${{ secrets.EMAIL_TO }}                   # ontvanger
        run: |
          python scripts/check_goals.py > goals_email.txt 2>&1 || true
          echo "=== goals_email.txt ==="
          cat goals_email.txt

      - name: Send results email (SMTP)
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          # SMTP server settings (zet als repo secrets)
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Garmin sync: doelenstatus voor gisteren en vandaag"
          body: ${{ steps.run_goals_check_and_produce_email.outputs.body || '' }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.SMTP_FROM }}
          # fallback: gebruik het gegenereerde bestand als body
          body_file: scripts/goals_email.txt
