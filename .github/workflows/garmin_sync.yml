name: Garmin Connect Daily Sync

on:
  schedule:
    - cron: "0 6 * * *"   # ongeveer 08:00 Amsterdam
    - cron: "0 18 * * *"  # ongeveer 20:00 Amsterdam
  workflow_dispatch:

concurrency:
  group: garmin-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install garminconnect gspread google-auth pandas
          fi

      - name: Run sync (daily_sync.py or fallback to activities+health) with logging
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ -f daily_sync.py ]; then
            python daily_sync.py 2>&1 | tee sync.log
            exit_code=${PIPESTATUS[0]}
          else
            python sync_activities.py 2>&1 | tee sync_activities.log
            act_code=${PIPESTATUS[0]}
            python sync_health.py 2>&1 | tee sync_health.log
            hlth_code=${PIPESTATUS[0]}
            cat sync_activities.log sync_health.log > sync.log || true
            if [ "${act_code}" != "0" ] || [ "${hlth_code}" != "0" ]; then
              exit_code=1
            else
              exit_code=0
            fi
          fi
          exit ${exit_code}

      - name: Run goals check and produce email body
        if: always()
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOAL_DISTANCE_KM: ${{ secrets.GOAL_DISTANCE_KM }}
          GOAL_STEPS: ${{ secrets.GOAL_STEPS }}
        run: |
          mkdir -p scripts
          python scripts/check_goals.py > scripts/goals_email.log 2>&1 || true
          echo "=== goals_email.txt ==="
          cat scripts/goals_email.txt || true
          cat scripts/goals_email.log || true

      - name: Debug email body (workspace check)
        run: |
          workspace=${GITHUB_WORKSPACE:-$(pwd)}
          echo "Workspace: $workspace"
          ls -la "$workspace/scripts" || true
          echo "File size:"
          wc -c "$workspace/scripts/goals_email.txt" || true
          echo "Preview:"
          sed -n '1,200p' "$workspace/scripts/goals_email.txt" || true

      - name: Read email body into output
        id: read_body
        run: |
          workspace=${GITHUB_WORKSPACE:-$(pwd)}
          file="$workspace/scripts/goals_email.txt"
          if [ ! -f "$file" ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "Geen inhoud beschikbaar" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi
          # safe multiline output via GITHUB_OUTPUT heredoc
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat "$file" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send results email via SMTP
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Garmin sync: doelenstatus gisteren en vandaag"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.SMTP_FROM }}
          content_type: "text/plain"
          body: ${{ steps.read_body.outputs.body }}


      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log
          path: |
            sync.log
            scripts/goals_email.txt
            scripts/goals_email.log
